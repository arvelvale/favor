<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Fusion - 添加用户</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>
        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2 bg-dark sidebar">
                <div class="sidebar-heading d-flex align-items-center px-3 mt-4 mb-4">
                    <i class="fas fa-utensils me-2 text-light"></i>
                    <span class="text-light fs-4">Flavor Fusion</span>
                </div>
                <div class="list-group list-group-flush">
                    <a href="/admin/dashboard" class="list-group-item list-group-item-action bg-dark text-light">
                        <i class="fas fa-tachometer-alt me-2"></i> 控制面板
                    </a>
                    <a href="/admin/users" class="list-group-item list-group-item-action bg-dark text-light active">
                        <i class="fas fa-users me-2"></i> 用户管理
                    </a>
                    <a href="/admin/members" class="list-group-item list-group-item-action bg-dark text-light">
                        <i class="fas fa-crown me-2"></i> 会员管理
                    </a>
                    <a href="#" class="list-group-item list-group-item-action bg-dark text-light">
                        <i class="fas fa-cog me-2"></i> 系统设置
                    </a>
                    <a href="/" class="list-group-item list-group-item-action bg-dark text-light">
                        <i class="fas fa-home me-2"></i> 返回首页
                    </a>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-md-10 ms-sm-auto main-content">
                <!-- 顶部导航 -->
                <div class="row mb-4 border-bottom py-3">
                    <div class="col d-flex justify-content-between align-items-center">
                        <h3>添加新用户</h3>
                        <div class="admin-info d-flex align-items-center">
                            <span class="me-3">管理员：Flavor</span>
                            <a href="/admin/logout" class="btn btn-outline-danger btn-sm">
                                <i class="fas fa-sign-out-alt me-1"></i>退出
                            </a>
                        </div>
                    </div>
                </div>

                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i> {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <!-- 添加用户表单 -->
                <div class="row">
                    <div class="col-md-8 mx-auto">
                        <div class="card">
                            <div class="card-header bg-transparent">
                                <h5 class="mb-0">新用户信息</h5>
                            </div>
                            <div class="card-body">
                                <form action="/admin/user/add" method="post" id="addUserForm">
                                    <div class="mb-3">
                                        <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="username" name="username" required>
                                        <div class="form-text" id="usernameHelp">用户名必须唯一</div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="email" class="form-label">电子邮箱 <span class="text-danger">*</span></label>
                                        <input type="email" class="form-control" id="email" name="email" required>
                                        <div class="form-text" id="emailHelp">邮箱必须唯一</div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="password" name="password" required>
                                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                        </div>
                                        <div class="form-text">密码至少包含6个字符</div>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label for="bio" class="form-label">个人简介</label>
                                        <textarea class="form-control" id="bio" name="bio" rows="3"></textarea>
                                    </div>
                                    
                                    <div class="d-flex justify-content-between">
                                        <a href="/admin/users" class="btn btn-outline-secondary">
                                            <i class="fas fa-arrow-left me-1"></i>返回
                                        </a>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-user-plus me-1"></i>创建用户
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 密码显示/隐藏切换
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // 切换图标
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });
            
            // 表单验证
            const addUserForm = document.getElementById('addUserForm');
            
            addUserForm.addEventListener('submit', function(event) {
                let isValid = true;
                
                // 验证密码长度
                if (passwordInput.value.length < 6) {
                    isValid = false;
                    passwordInput.classList.add('is-invalid');
                    
                    // 添加错误信息
                    if (!document.getElementById('passwordError')) {
                        const errorDiv = document.createElement('div');
                        errorDiv.id = 'passwordError';
                        errorDiv.className = 'invalid-feedback';
                        errorDiv.textContent = '密码必须至少包含6个字符';
                        passwordInput.parentNode.appendChild(errorDiv);
                    }
                } else {
                    passwordInput.classList.remove('is-invalid');
                    const errorDiv = document.getElementById('passwordError');
                    if (errorDiv) errorDiv.remove();
                }
                
                if (!isValid) {
                    event.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
