<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Fusion - 管理员登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
        }
        
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-logo i {
            font-size: 48px;
            color: #ff6b35;
        }
        
        .login-title {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            color: #333;
        }
        
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(255, 107, 53, 0.25);
            border-color: #ff6b35;
        }
        
        .btn-primary {
            background-color: #ff6b35;
            border-color: #ff6b35;
            padding: 10px 0;
        }
        
        .btn-primary:hover,
        .btn-primary:focus {
            background-color: #e55a25;
            border-color: #e55a25;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .form-group i {
            position: absolute;
            left: 15px;
            top: 14px;
            color: #aaa;
        }
        
        .form-control {
            padding-left: 40px;
            height: 48px;
        }
        
        .alert {
            border-radius: 5px;
            padding: 10px 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <i class="fas fa-utensils"></i>
        </div>
        <h4 class="login-title">Flavor Fusion 管理后台</h4>
        
        {% if error %}
        <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i> {{ error }}
        </div>
        {% endif %}
        
        <form method="post" action="{{ url_for('admin.admin_login_post') }}">
            <div class="form-group">
                <i class="fas fa-user"></i>
                <input type="text" class="form-control" name="username" placeholder="管理员账号" required>
            </div>
            <div class="form-group">
                <i class="fas fa-lock"></i>
                <input type="password" class="form-control" name="password" placeholder="管理员密码" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">登录管理系统</button>
        </form>
        
        <div class="login-footer">
            <a href="/" class="text-decoration-none text-muted">
                <i class="fas fa-arrow-left me-1"></i> 返回用户前台
            </a>
        </div>
    </div>
</body>
</html>
